<!DOCTYPE html>
<html lang="pt-BR">

<head>

<title>Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{

background:#006341;

color:white;

padding:20px;

border-radius:0 0 20px 20px;

}

.cards{

padding:15px;

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

text-align:center;

font-weight:bold;

box-shadow:0 2px 8px rgba(0,0,0,.15);

}

a{
text-decoration:none;
color:black;
}

</style>

</head>

</div>
